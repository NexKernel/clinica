server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS embebido de Docker. Sin esto, nginx resuelve el nombre del backend una
    # sola vez al cargar la configuración y lo cachea para siempre: tras un
    # redespliegue el contenedor nuevo estrena IP y el proxy se queda clavado en
    # la vieja, devolviendo 502 (connect() failed, host is unreachable).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # El nombre del backend lleva el prefijo del proyecto: en Dokploy todos los
    # stacks comparten dokploy-network y un `backend` genérico resolvería al de
    # otra aplicación. Va en una variable a propósito: es lo que obliga a nginx a
    # resolverlo en cada petición, respetando el `valid` del resolver.
    set $backend http://policlinico-backend:8000;

    # Los adjuntos clínicos pesan hasta MAX_ATTACHMENT_BYTES (10 MB por defecto).
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    # Logo y archivos subidos que el backend expone como estáticos.
    location /media/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass $backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El index no se cachea nunca: es quien apunta a los assets del último build.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Rutas del router de React (/pacientes, /resultados/:token, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
